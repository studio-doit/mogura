<!DOCTYPE html><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<!-- ゲーム画面をHTMLで用意 --- (*1) -->
<body style="text-align: center;">
    <h1 id="info" style="color: brown">モグラ叩き</h1>
    <button id="start_btn">ゲーム開始</button><br><br>
    <canvas id="canvas" width="390" height="600"
        style="border:1px solid black;"></canvas>
    <!-- モグラの画像を読み込む -->
    <img src="mogura.png" id="mogura_img" style="display:none;">
    <img src="hatake.png" id="hatake_img" style="display:none;">
</body>
<script type="py">
    import random
    from pyscript import document
    from js import setTimeout
    from pyodide.ffi import create_proxy

    # 定数の宣言 --- (*2)
    GAME_TURNS = 30  # ゲーム終了までのターン数
    INTERVAL = 1000  # モグラが出現する間隔(ミリ秒)
    MOGURA_SIZE = 50  # モグラのサイズ(正方形の一辺の長さ)
    # 開始ボタンやinfo要素の取得 --- (*3)
    start_btn = document.getElementById("start_btn")  # 開始ボタンを取得
    info = document.getElementById("info")  # 情報表示用の要素を取得
    # Canvasの取得 --- (*4)
    canvas = document.getElementById("canvas")  # キャンバスを取得
    context = canvas.getContext("2d")  # 2D描画コンテキストを取得
    # ゲーム全体の流れを辞書型変数で管理 --- (*5)
    game = {
        "turns": GAME_TURNS,  # 残りのゲームターン数
        "score": 0,  # スコア
    }
    # モグラの情報を管理
    mogura = {
        "x": 0,  # x座標
        "y": 0,  # y座標
        "hide": True,  # モグラが隠れているかどうか
    }
    def start(event):
        """ボタンをクリックされたときの処理"""  # --- (*6)
        game["turns"] = GAME_TURNS  # ゲームターン数を初期化
        game["score"] = 0  # スコアを初期化
        start_btn.disabled = True  # スタートボタンを無効化
        # 初回タイマーをセット
        setTimeout(create_proxy(next_turn), INTERVAL)
    
    def next_turn():
        """次のターンの処理を行う関数"""  # --- (*7)
        # 残りのターン数を確認
        if game["turns"] <= 0:
            game_over()
            return
        game["turns"] -= 1  # 残りターン数を1減らす
        # モグラが頭を出す？ ---- (*8)
        mogura["hide"] = not mogura["hide"]
        if not mogura["hide"]:
            # モグラの位置をランダムに決定 --- (*9)
            mogura["x"] = random.randint(0, canvas.width - MOGURA_SIZE)
            mogura["y"] = random.randint(0, canvas.height - MOGURA_SIZE)
        draw_screen()  # 画面を描画
        # 次回のタイマーをセット --- (*10)
        setTimeout(create_proxy(next_turn), INTERVAL)
    
    def draw_screen():
        """画面を描画する関数"""  # --- (*11)
        # 画面をクリア
        context.clearRect(0, 0, canvas.width, canvas.height)
        hatake_img = document.getElementById("hatake_img")
        context.drawImage(hatake_img, 0, 0, canvas.width, canvas.height)
        # モグラを描画
        if not mogura["hide"]:
            mogura_img = document.getElementById("mogura_img")
            context.drawImage(mogura_img, mogura["x"], mogura["y"], MOGURA_SIZE, MOGURA_SIZE)
        # スコアを表示
        info.innerText = f"スコア: {game['score']}点 / 残り時間: {game['turns']}"

    def canvas_on_click(event):
        """canvasをクリックした時の処理"""  # --- (*12)
        # クリックされた位置を取得
        rect = canvas.getBoundingClientRect()
        click_x = event.clientX - rect.left
        click_y = event.clientY - rect.top
        # モグラが出現しているか？
        if not mogura["hide"]:
            # モグラの範囲内をクリックしたか？ --- (*13)
            if (mogura["x"] <= click_x <= mogura["x"] + MOGURA_SIZE and
                mogura["y"] <= click_y <= mogura["y"] + MOGURA_SIZE):
                game["score"] += 1  # スコアを1点加算
                mogura["hide"] = True  # モグラを消す
                draw_screen()  # 画面を描画

    def game_over():
        """ ゲーム終了時に呼び出される関数 """  # --- (*14)
        draw_screen()  # 画面を描画
        info.innerText = f"モグラ叩き終了: スコア {game['score']}点"
        start_btn.disabled = False  # スタートボタンを有効化

    # クリックイベントを設定 --- (*15)
    start_btn.addEventListener("click", create_proxy(start))
    canvas.addEventListener("click", create_proxy(canvas_on_click))
</script>
